# Application
spring.application.name=${SPRING_APPLICATION_NAME:triviaquestionservice}

# Server
server.port=${SERVER_PORT:8080}

# OpenAPI documentation
springdoc.api-docs.path=${SPRINGDOC_API_DOCS_PATH:/v3/api-docs}
springdoc.swagger-ui.path=${SPRINGDOC_SWAGGER_UI_PATH:/swagger-ui.html}

# Logging
logging.level.root=${LOGGING_LEVEL_ROOT:INFO}
logging.level.nl.bramv.triviaquestionservice=${LOGGING_LEVEL_APP:DEBUG}

# Questions Provider
questions.provider=${TRIVIA_PROVIDER:opentriviadb}

# Open Trivia DB
opentriviadb.provider-name=${OPENTDB_PROVIDER_NAME:OpenTriviaDB}
opentriviadb.base-url=${OPENTDB_BASE_URL:https://opentdb.com}

# Answer Verification
verification.type=${VERIFICATION_TYPE:hashVerification}
verification.secret=${APP_HASH_SECRET:development-only-secret}